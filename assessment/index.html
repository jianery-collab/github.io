let lang=document.documentElement.lang.startsWith("zh")?"zh":"en";
const scores=[1,1,1,1,1,1];
const shown=[1,1,1,1,1,1];
let owner=null, resultOpen=false;
const $=id=>document.getElementById(id);
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- radar ---------- */
const CX=210,CY=180,R=118,N=6;
const ang=i=>-Math.PI/2+i*2*Math.PI/N;
const pt=(i,v)=>[CX+Math.cos(ang(i))*R*v/5,CY+Math.sin(ang(i))*R*v/5];
const svgNS="http://www.w3.org/2000/svg";
const radar=$("radar");
function el(tag,attrs){const e=document.createElementNS(svgNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e}
for(let r=1;r<=5;r++){
  radar.appendChild(el("polygon",{class:"ring",points:[...Array(N)].map((_,i)=>pt(i,r).join(",")).join(" ")}));
}
for(let i=0;i<N;i++){const [x,y]=pt(i,5);radar.appendChild(el("line",{class:"spoke",x1:CX,y1:CY,x2:x,y2:y}))}
const shape=el("polygon",{class:"shape"});radar.appendChild(shape);
const dots=[...Array(N)].map(()=>{const d=el("circle",{class:"dot",r:4});radar.appendChild(d);return d});
const labels=[...Array(N)].map(()=>{const t=el("text",{class:"lbl"});radar.appendChild(t);return t});

function drawShape(){
  shape.setAttribute("points",shown.map((v,i)=>pt(i,v).join(",")).join(" "));
  dots.forEach((d,i)=>{const [x,y]=pt(i,shown[i]);d.setAttribute("cx",x);d.setAttribute("cy",y)});
}
function drawLabels(){
  const max=Math.max(...scores);
  labels.forEach((t,i)=>{
    const lines=T[lang].goals[i][2];
    const a=ang(i), x=CX+Math.cos(a)*(R+16), y=CY+Math.sin(a)*(R+16);
    const c=Math.cos(a), s=Math.sin(a);
    t.setAttribute("text-anchor",Math.abs(c)<.2?"middle":(c>0?"start":"end"));
    const lh=15, h=(lines.length-1)*lh;
    let y0 = s<-.8 ? y-h-4 : s>.8 ? y+12 : y-h/2+4;
    t.textContent="";
    lines.forEach((ln,k)=>{const ts=el("tspan",{x:x,y:y0+k*lh});ts.textContent=ln;t.appendChild(ts)});
    t.classList.toggle("top",max>=4&&scores[i]===max);
  });
}
let raf=null;
function animate(){
  let moving=false;
  for(let i=0;i<N;i++){
    const d=scores[i]-shown[i];
    if(Math.abs(d)>.005){shown[i]+=d*.22;moving=true}else shown[i]=scores[i];
  }
  drawShape();
  raf=moving?requestAnimationFrame(animate):null;
}
function kick(){if(reduce){shown.splice(0,N,...scores);drawShape()}else if(!raf)raf=requestAnimationFrame(animate)}

/* ---------- sliders ---------- */
const list=$("goals");
for(let i=0;i<N;i++){
  const li=document.createElement("li");li.className="goal";
  li.innerHTML=`<div class="goal-head"><h2 id="g${i}"></h2><span class="level" id="lv${i}"></span></div>
  <p id="d${i}"></p>
  <input type="range" min="1" max="5" step="1" value="1" id="s${i}" aria-labelledby="g${i}">
  <div class="ticks" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>`;
  list.appendChild(li);
  const s=li.querySelector("input");
  s.addEventListener("input",()=>{scores[i]=+s.value;paintSlider(i);drawLabels();kick();if(resultOpen)renderResult()});
}
function paintSlider(i){
  const s=$("s"+i);s.style.setProperty("--p",((scores[i]-1)/4*100)+"%");
  $("lv"+i).textContent=T[lang].levels[scores[i]-1];
  s.setAttribute("aria-valuetext",T[lang].levels[scores[i]-1]);
}

/* ---------- gate ---------- */
document.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>{
  owner=b.dataset.owner;
  document.querySelectorAll(".choice").forEach(c=>c.setAttribute("aria-pressed",c===b?"true":"false"));
  $("err").textContent="";
  if(resultOpen)renderResult();
}));

/* ---------- result logic ---------- */
function topGoals(){
  const max=Math.max(...scores);
  const idx=scores.map((v,i)=>v===max?i:-1).filter(i=>i>=0).slice(0,3);
  const names=idx.map(i=>T[lang].goals[i][0]);
  const L=T[lang];
  const q=lang==="zh"?n=>`“${n}”`:n=>n.toLowerCase();
  const qs=names.map(q);
  return qs.length===1?qs[0]:qs.slice(0,-1).join(L.comma)+L.and+qs[qs.length-1];
}
function classify(){
  const high=scores.filter(v=>v>=4).length;
  if(Math.max(...scores)<=2) return "low";
  if(high>=4 || (scores[5]>=4 && high>=2)) return owner==="no"?"gated":"broad";
  return "focused";
}
function renderResult(){
  const L=T[lang], k=classify(), t=topGoals();
  const map={
    low:[L.talk,L.lowH,L.lowB()],
    focused:[L.expert,L.focusedH,L.focusedB(t)],
    broad:[L.project,L.broadH,L.broadB(t)],
    gated:[L.expert,L.focusedH,L.gatedB(t)]
  }[k];
  $("rModel").textContent=map[0];$("rHead").textContent=map[1];$("rBody").textContent=map[2];
  $("mailBtn").href="mailto:jan.yang@pricinggoat.com?subject="+encodeURIComponent(L.subject)+"&body="+encodeURIComponent(profileText(map[0])+L.mailEnd);
}
function profileText(model){
  const L=T[lang];
  const lines=scores.map((v,i)=>`${L.goals[i][0]}: ${v}/5`);
  lines.push("",L.ownerLine(owner==="yes"?L.yes:L.no),`${L.sugg}: ${model}`);
  return L.mailIntro+lines.join("\n");
}
$("showBtn").addEventListener("click",()=>{
  if(!owner){$("err").textContent=T[lang].err;return}
  resultOpen=true;renderResult();
  const r=$("result");r.classList.add("show");
  r.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
});
$("copyBtn").addEventListener("click",async()=>{
  try{await navigator.clipboard.writeText(profileText($("rModel").textContent));
    $("copyBtn").textContent=T[lang].copied;setTimeout(()=>$("copyBtn").textContent=T[lang].copy,1800)}catch(e){}
});

/* ---------- language ---------- */
function applyLang(){
  const L=T[lang];
  $("title").textContent=L.title;$("sub").textContent=L.sub;
  for(let i=0;i<N;i++){$("g"+i).textContent=L.goals[i][0];$("d"+i).textContent=L.goals[i][1];paintSlider(i)}
  $("gateQ").textContent=L.gateQ;
  document.querySelector('[data-owner="yes"]').textContent=L.yes;
  document.querySelector('[data-owner="no"]').textContent=L.no;
  if($("err").textContent)$("err").textContent=L.err;
  $("showBtn").textContent=L.show;
  $("shareTxt").textContent=L.shareTxt;$("mailBtn").textContent=L.mail;$("copyBtn").textContent=L.copy;
  drawLabels();if(resultOpen)renderResult();
}

applyLang();drawShape();
</script>
</body>
</html>
